[package]
name = "minos"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CLI tool for Cardano treasury contracts: milestone management and withdrawal creation"

[lib]
name = "minos"
path = "src/lib.rs"

[[bin]]
name = "minos"
path = "src/main.rs"

[dependencies]
# Cardano primitives and tx building
pallas-primitives = "1.4.0"
pallas-codec = "1.4.0"
pallas-txbuilder = "1.4.0"
pallas-crypto = "1.4.0"
pallas-addresses = "1.4.0"
pallas-traverse = "1.4.0"
pallas-network = "1.4.0"
# Key derivation (already in lockfile as transitive deps)
bip39 = "2"
ed25519-bip32 = "0.4"
cryptoxide = "0.4"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# MAF document generation
docx-rs = "0.4"

# Flat UPLC encoding for applyParamsToScript
uplc = "1.1"
