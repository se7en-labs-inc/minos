[package]
name = "minos-portal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "TOM Portal: chain indexer + GraphQL API for Cardano treasury oversight"

[dependencies]
# Web server
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors"] }

# GraphQL
async-graphql = { version = "7", features = ["chrono"] }
async-graphql-axum = "7"

# Shared Cardano types and script logic from minos
minos = { path = "../minos" }
pallas-primitives = "1.4.0"
pallas-codec = "1.4.0"
pallas-addresses = "1.4.0"
pallas-crypto = "1.4.0"
pallas-network = "1.4.0"
pallas-traverse = "1.4.0"

# Storage
sled = "0.34"
duckdb = { version = "1", features = ["bundled"] }

# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
